name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      # persist-credentials: false, as in every workflow in this repo.
      # actions/checkout otherwise leaves its token in a config file that an
      # includeIf.gitdir pulls into this checkout, where it overrides every
      # other credential for github.com. This job pushes nothing and has no
      # use for it; the jobs that do push must not have it. logbook#18.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the shift watcher's notifier
        run: python3 scripts/test_notify_shift_outcome.py

      - name: Test the shift watcher's re-runner
        run: python3 scripts/test_rerun_dead_shift.py

      - name: Test the transcript redactor
        run: python3 scripts/test_redact_transcript.py

      - name: Test the push-identity check
        run: python3 scripts/test_check_push_identity.py

      - name: Check for dead workflow triggers
        run: |
          pip install --quiet git+https://github.com/committed-nightly/deadtrigger@v0.1.0
          deadtrigger --default-branch main
