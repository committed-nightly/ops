name: Jen

# Lives in committed-nightly/ops alongside the night shift, on the
# default branch.
# Ten hours after Richmond clocks in, so a long build can't overlap the
# review of it.

on:
  schedule:
    - cron: "0 8 * * *"     # 08:00 UTC
  workflow_dispatch:

jobs:
  jen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    steps:
      # A separate app from Richmond's, so GitHub accepts her approval
      # on his PR and required_approving_review_count: 1 works.
      - name: Mint Jen's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.JEN_APP_ID }}
          private-key: ${{ secrets.JEN_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare the shift
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # Don't set git config here — the action overwrites it with
          # claude[bot] afterwards. Jen sets her own at clock-in.
          BOT_ID=$(gh api /users/jennifer-barber%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"
          echo "BOT_SLUG=jennifer-barber" >> "$GITHUB_ENV"
          echo "BOT_DISPLAY=Jen" >> "$GITHUB_ENV"
          echo "BOT_ICON=:sunny:" >> "$GITHUB_ENV"

          gh api /orgs/committed-nightly --jq .login

          # Nothing to review is a legitimate morning.
          OPEN=$(gh search prs --owner committed-nightly --state open --json number --jq 'length')
          echo "open PRs: $OPEN"

      - name: Run the shift
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: jen
          BOT_SLUG: jennifer-barber
          SLACK_DISPLAY_NAME: Jen
          SLACK_ICON_URL: ${{ vars.JEN_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/day-shift"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
