name: Day Shift

# Lives in committed-nightly/ops alongside the night shift, on the
# default branch.
# Ten hours after Richmond clocks in, so a long build can't overlap the
# review of it.

on:
  schedule:
    - cron: "0 8 * * *"     # 08:00 UTC
  workflow_dispatch:

jobs:
  jen:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    steps:
      # Jen's own app, and this is the whole reason the design works
      # again: two distinct installation tokens mean two distinct
      # identities, so GitHub will accept jennifer-barber[bot]'s approval on a PR
      # authored by richmond-avenal[bot]. Branch protection can go back to
      # required_approving_review_count: 1 and actually mean it.
      - name: Mint Jen's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.JEN_APP_ID }}
          private-key: ${{ secrets.JEN_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare the shift
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
        run: |
          set -euo pipefail

          # An unset repository variable renders as the empty string, and an
          # empty channel id is not an error until the shift tries to post --
          # which is the last thing it does. Fail here instead, thirty seconds
          # in, rather than after ninety minutes of work with nowhere to file
          # it. This is the whole reason the ids are read in this step too.
          for v in SLACK_SHIFT_LOG SLACK_ORDERS SLACK_INCIDENTS SLACK_GENERAL SLACK_MEMES; do
            if [ -z "${!v}" ]; then
              echo "::error::repository variable $v is not set. Actions → Variables, on committed-nightly/ops." >&2
              exit 1
            fi
          done

          # Look up the bot's numeric id and hand it to the shift as an
          # env var. Do NOT set git config here: the action configures git
          # as claude[bot] AFTER this step runs, so anything set now is
          # overwritten. Jen sets her own identity at clock-in.
          BOT_ID=$(gh api /users/jennifer-barber%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"

          gh api /orgs/committed-nightly --jq .login

          # Nothing to review is a legitimate morning. Say so and stop
          # rather than inventing work to justify the run.
          OPEN=$(gh search prs --owner committed-nightly --state open --json number --jq 'length')
          echo "open PRs: $OPEN"

      - name: Run the shift
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: jen
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Channel ids live in repository variables, not here. They were
          # duplicated across both workflows and SHIFT_LOG and INCIDENTS had
          # drifted into each other's slots -- last night's incident report
          # went to #shift-log. One place to set them, both shifts read it.
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/day-shift"
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
