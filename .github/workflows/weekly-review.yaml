name: Moss

on:
  schedule:
    - cron: "0 19 * * 0"     # Sunday 19:00 UTC, after the week's shifts
  workflow_dispatch:

jobs:
  moss:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Mint token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MOSS_APP_ID }}
          private-key: ${{ secrets.MOSS_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          
          pip install --quiet requests pandas matplotlib
          
          BOT_ID=$(gh api /users/maurice-moss%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"

          EMAIL="$BOT_ID+maurice-moss[bot]@users.noreply.github.com"
          {
            echo "GIT_AUTHOR_NAME=maurice-moss[bot]"
            echo "GIT_AUTHOR_EMAIL=$EMAIL"
            echo "GIT_COMMITTER_NAME=maurice-moss[bot]"
            echo "GIT_COMMITTER_EMAIL=$EMAIL"
          } >> "$GITHUB_ENV"

          # Fail here rather than three hours in.
          gh api /orgs/committed-nightly --jq .login
          gh repo clone committed-nightly/logbook logbook

      - name: Run the analysis
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: moss
          METRICS_DIR: logbook/metrics
          BOT_SLUG: maurice-moss
          BOT_DISPLAY: Moss
          SLACK_ICON_URL: ${{ vars.MOSS_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
          SLACK_METRICS: ${{ vars.SLACK_METRICS }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/weekly-review"
          show_full_output: ${{ runner.debug == '1' }}
          claude_args: |
            ${{ runner.debug == '1' && '--debug' || '' }}
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
