name: Weekly Review

# Moss. Sundays, after the week has happened.
#
# His own GitHub App, installed read-only across the org and writing only
# to logbook/metrics/, so an observer can't quietly become a participant.
# That asymmetry is the one that matters and it's enforced by the
# installation.
#
# Slack is the shared app — the shifts and Moss post under different
# display names from one token. It needs groups:history for the private
# #shift-log, which is the same scope the night shift needs for threading.
# #metrics staying out of their reach is a prompt-level rule, not a
# technical boundary; there was never a way to enforce it in Slack.
#
# Replaces the old weekly-review workflow.

on:
  schedule:
    - cron: "0 19 * * 0"     # Sunday 19:00 UTC, after the week's shifts
  workflow_dispatch:

jobs:
  moss:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Mint token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MOSS_APP_ID }}
          private-key: ${{ secrets.MOSS_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pip install --quiet requests pandas matplotlib
          BOT_ID=$(gh api /users/maurice-moss%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"
          gh api /orgs/committed-nightly --jq .login

      - name: Run the analysis
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: moss
          BOT_SLUG: maurice-moss
          SLACK_DISPLAY_NAME: Moss
          SLACK_ICON_URL: ${{ vars.MOSS_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
          SLACK_METRICS: ${{ vars.SLACK_METRICS }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/weekly-review"
          claude_args: |
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
