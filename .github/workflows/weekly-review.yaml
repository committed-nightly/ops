name: Moss

# Moss. Sundays, after the week has happened.
#
# His app is installed read-only across the org and writes only to
# logbook/metrics/ — an observer that can change what it observes isn't
# one. Slack is the shared app; #metrics staying out of the shifts' reach
# is a prompt rule, not a technical boundary.

on:
  schedule:
    - cron: "0 19 * * 0"     # Sunday 19:00 UTC, after the week's shifts
  workflow_dispatch:

jobs:
  moss:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Mint token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MOSS_APP_ID }}
          private-key: ${{ secrets.MOSS_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the shift
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pip install --quiet requests pandas matplotlib
          BOT_ID=$(gh api /users/maurice-moss%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"
          gh api /orgs/committed-nightly --jq .login


      - name: Run the analysis
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: moss
          BOT_SLUG: maurice-moss
          BOT_DISPLAY: Moss
          SLACK_ICON_URL: ${{ vars.MOSS_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
          SLACK_METRICS: ${{ vars.SLACK_METRICS }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/weekly-review"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
