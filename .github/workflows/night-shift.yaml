name: Richmond

# Must live on the default branch — scheduled workflows only run from there.

on:
  schedule:
    - cron: "0 22 * * *"    # 22:00 UTC
  workflow_dispatch:

jobs:
  richmond:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write        # required by the action's own auth

    steps:
      # owner without a repositories list scopes the token org-wide,
      # which is what lets Richmond create new repos.
      - name: Mint Richmond's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RICHMOND_APP_ID }}
          private-key: ${{ secrets.RICHMOND_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare the shift
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # Don't set git config here — the action overwrites it with
          # claude[bot] afterwards. The shift sets its own at clock-in.
          BOT_ID=$(gh api /users/richmond-avenal%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"
          echo "BOT_SLUG=richmond-avenal" >> "$GITHUB_ENV"
          echo "BOT_DISPLAY=Richmond" >> "$GITHUB_ENV"
          echo "BOT_ICON=:crescent_moon:" >> "$GITHUB_ENV"

          # Fail here rather than three hours in.
          gh api /orgs/committed-nightly --jq .login

      - name: Run the shift
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: richmond
          BOT_SLUG: richmond-avenal
          SLACK_DISPLAY_NAME: Richmond
          SLACK_ICON_URL: ${{ vars.RICHMOND_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/night-shift"
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
