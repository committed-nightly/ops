name: Richmond

on:
  schedule:
    - cron: "0 22 * * *"    # 22:00 UTC
  workflow_dispatch:

jobs:
  richmond:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Mint Richmond's token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RICHMOND_APP_ID }}
          private-key: ${{ secrets.RICHMOND_PRIVATE_KEY }}
          owner: committed-nightly

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Preflight
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          # Credentials are scoped to this checkout only: actions/checkout
          # writes them into a file pulled in by includeIf.gitdir, matched
          # against this path. A repo cloned into the scratch directory gets
          # none, and finds out at its first push — which for a shift is the
          # last thing it does, appending its own ledger line. This installs
          # gh as a global credential helper so any clone on the box can push.
          # See logbook#10.
          gh auth setup-git

          BOT_ID=$(gh api /users/richmond-avenal%5Bbot%5D --jq .id)
          echo "BOT_USER_ID=$BOT_ID" >> "$GITHUB_ENV"

          EMAIL="$BOT_ID+richmond-avenal[bot]@users.noreply.github.com"
          {
            echo "GIT_AUTHOR_NAME=richmond-avenal[bot]"
            echo "GIT_AUTHOR_EMAIL=$EMAIL"
            echo "GIT_COMMITTER_NAME=richmond-avenal[bot]"
            echo "GIT_COMMITTER_EMAIL=$EMAIL"
          } >> "$GITHUB_ENV"

          # Fail here rather than three hours in.
          gh api /orgs/committed-nightly --jq .login

      - name: Run the shift
        uses: anthropics/claude-code-action@v1
        env:
          SHIFT_NAME: richmond
          SHIFT_TRANSCRIPT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          BOT_SLUG: richmond-avenal
          BOT_DISPLAY: Richmond
          SLACK_ICON_URL: ${{ vars.RICHMOND_ICON_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SHIFT_LOG: ${{ vars.SLACK_SHIFT_LOG }}
          SLACK_ORDERS: ${{ vars.SLACK_ORDERS }}
          SLACK_INCIDENTS: ${{ vars.SLACK_INCIDENTS }}
          SLACK_GENERAL: ${{ vars.SLACK_GENERAL }}
          SLACK_MEMES: ${{ vars.SLACK_MEMES }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          prompt: "/night-shift"
          show_full_output: ${{ runner.debug == '1' }}
          claude_args: |
            ${{ runner.debug == '1' && '--debug' || '' }}
            --model claude-opus-5
            --max-turns 200
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # The record of what a shift actually did, as opposed to what it says it
      # did. `show_full_output` is off, so none of the agent's turns reach the
      # job log, and the action's own copy under RUNNER_TEMP dies with the
      # runner. Both shift routines used to end by printing a
      # `https://claude.ai/code/...` link built from CLAUDE_CODE_REMOTE_SESSION_ID,
      # which is not set in an Actions runner and never will be — that variable
      # belongs to cloud sessions. See logbook#6.
      #
      # `always()` because the shift you most want to read is the one that
      # failed. Exit 3 means the job was killed before the action wrote
      # anything at all: nothing to keep, and not a fault of this step.
      #
      # Nothing is uploaded that was not first redacted and self-checked. `ops`
      # is public, artifacts are not masked the way job logs are, and this
      # shift's environment holds a live installation token and a Slack bot
      # token. If the redactor cannot finish, it writes no file, this step goes
      # red and the upload below finds nothing to upload.
      - name: Redact the transcript
        id: transcript
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/redact-transcript.py \
            "$RUNNER_TEMP/claude-execution-output.json" \
            "$RUNNER_TEMP/transcript.json" || [ $? -eq 3 ]
          if [ -f "$RUNNER_TEMP/transcript.json" ]; then
            echo "kept=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the transcript
        if: always() && steps.transcript.outputs.kept == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Named per attempt, not per run: a re-run is a different session
          # and overwriting the first one would lose exactly the transcript
          # someone came looking for.
          name: transcript-richmond-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcript.json
          retention-days: 90
          if-no-files-found: error
